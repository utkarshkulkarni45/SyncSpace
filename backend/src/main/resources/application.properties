server.port=8080

# Spring Loom Virtual Threads (Java 21)
spring.threads.virtual.enabled=true

# Database Configuration (PostgreSQL with graceful H2 dev/fallback mode)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:syncspacedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Redis Configuration (Optional / Graceful fallback in service if standalone)
spring.data.redis.host=${SPRING_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_REDIS_PASSWORD:}
spring.data.redis.timeout=2000

# Logging
logging.level.com.example.syncspace=INFO
logging.level.org.springframework.web.socket=INFO

